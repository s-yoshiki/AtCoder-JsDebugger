name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# 同時に走ったデプロイが互いを上書きしないようにする。
# 進行中のものは中断せず、最新のコミットが必ず最後に反映されるようにする。
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        # プロジェクトページなので /<repository>/ 配下で配信される。
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
