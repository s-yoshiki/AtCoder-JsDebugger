name: Feature request
description: 機能改善を提案する
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
      description: 機能そのものではなく、困っている状況を説明してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: 望ましい操作や表示を説明してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 現在の回避方法や、検討した別案があれば記載してください。
  - type: checkboxes
    id: boundaries
    attributes:
      label: 製品境界
      options:
        - label: ブラウザ内で完結する提案です
          required: true
        - label: JavaScript / TypeScript向けの提案です
          required: true
