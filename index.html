<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="author" content="s-yoshiki" />
    <!--
      v1 は HashRouter だったので、`#/config/stdin` のような URL が
      外部に残っている。ルーターが起動する前に実パスへ書き換える。
    -->
    <script>
      (function () {
        var hash = location.hash;
        if (hash.indexOf('#/') !== 0) return;
        var base = location.pathname.replace(/index\.html$/, '');
        var next = base.replace(/\/$/, '') + hash.slice(1);
        history.replaceState(null, '', next + location.search);
      })();
    </script>
    <!--
      保存済みテーマ (なければ OS 設定) を最初の描画前に適用し、
      誤ったテーマが一瞬表示されるのを防ぐ。
    -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('theme');
          var d =
            s === 'dark' ||
            (s !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', d);
          document.documentElement.style.colorScheme = d ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <title>AtCoder-JsDebugger</title>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
